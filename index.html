<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه جامع الزهرا (مساجد و پایگاه‌ها)</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --bg:#e9edf4;--bg2:#eef1f7;--sd:#c6ccd9;--sl:#fff;
  --txt:#39435c;--muted:#7b879c;--line:#d7dce6;
  --pri:#10b981;--pri2:#047857;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#0ea5e9;--gold:#f59e0b
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;font-size:14px}
.neu{background:var(--bg);border-radius:20px;box-shadow:9px 9px 18px var(--sd),-9px -9px 18px var(--sl)}
.neu-s{background:var(--bg);border-radius:14px;box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl)}
.neu-in{background:var(--bg);border-radius:14px;box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px;padding:34px 28px;border-radius:26px;text-align:center}
.login-logo{width:80px;height:80px;display:grid;place-items:center;font-size:34px;border-radius:22px;margin:0 auto 18px}
.login-card h1{margin:0 0 4px;font-size:1.25rem}.login-sub{color:var(--muted);font-size:.82rem;margin:0 0 22px}
.login-card form{display:flex;flex-direction:column;gap:14px;text-align:right}
.login-hint{margin-top:20px;padding:14px;background:var(--bg2);border-radius:14px;text-align:right;font-size:.73rem;color:var(--muted);line-height:2}
#loginErr{color:var(--bad);font-size:.8rem;min-height:18px;text-align:center}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:22px;padding:22px;min-height:100vh;max-width:1600px;margin:0 auto}
@media(max-width:960px){.wrap{grid-template-columns:1fr;padding:14px;gap:14px}}
.side{position:sticky;top:22px;height:calc(100vh - 44px);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
@media(max-width:960px){.side{position:static;height:auto}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand .logo{width:46px;height:46px;display:grid;place-items:center;font-size:22px;border-radius:14px}
.brand b{display:block;font-size:.86rem}.brand small{color:var(--muted);font-size:.68rem;display:block;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px;overflow:auto;flex:1}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;cursor:pointer;font-family:inherit;font-size:.8rem;color:var(--txt);padding:9px 12px;border-radius:13px;background:var(--bg);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:.15s;text-align:right}
.nav-btn span{font-size:1rem}.nav-btn:hover{color:var(--pri)}
.nav-btn.active{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:5px 5px 12px #bfc6d6,-4px -4px 10px var(--sl)}
.side-foot{display:flex;flex-direction:column;gap:8px}
.btn{border:0;cursor:pointer;border-radius:14px;padding:10px 16px;font-family:inherit;font-size:.84rem;background:var(--bg);color:var(--txt);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{color:var(--pri)}.btn:active{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:5px 5px 12px #c0c7d7,-4px -4px 10px var(--sl)}
.btn.primary:hover{color:#fff;filter:brightness(1.05)}
.btn.ok{color:#fff;background:linear-gradient(135deg,#34d399,#22c55e)}
.btn.bad{color:#fff;background:linear-gradient(135deg,#f87171,#ef4444)}
.btn.warn{color:#fff;background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.btn.gold{color:#fff;background:linear-gradient(135deg,#fbbf24,#d97706)}
.btn.sm{padding:6px 11px;font-size:.74rem;border-radius:11px}
.btn.full{width:100%}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;padding:9px 14px;flex:1;min-width:200px}
.search input{border:0;background:transparent;outline:none;font-family:inherit;font-size:.86rem;color:var(--txt);width:100%}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{padding:8px 14px;font-size:.76rem;color:var(--muted);border-radius:12px}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px}
.user-chip .av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));font-weight:700;font-size:.85rem}
.card{padding:20px;margin-bottom:18px;border-radius:20px}
.card h3{margin:0 0 16px;font-size:.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:14px 16px;border-radius:20px}
.stat .i{font-size:1.25rem}.stat .t{font-size:.72rem;color:var(--muted);margin-top:8px}
.stat .v{font-size:1.3rem;font-weight:700;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:800px){.grid3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:0;outline:none;font-family:inherit;font-size:.85rem;color:var(--txt);padding:10px 13px;border-radius:13px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl)}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl),0 0 0 2px #a7e4c9}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 7px;font-size:.82rem}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:4px 12px;font-size:.74rem;white-space:nowrap}
.tbl td{background:var(--bg2);padding:10px 12px;vertical-align:middle}
.tbl tbody tr td:first-child{border-radius:0 14px 14px 0}
.tbl tbody tr td:last-child{border-radius:14px 0 0 14px}
.tbl tbody tr:hover td{background:#e6eaf3}
.tbl-wrap{overflow-x:auto}
.badge{display:inline-block;padding:4px 10px;border-radius:10px;font-size:.7rem;font-weight:600}
.b-ok{background:#dcfce7;color:#15803d}.b-bad{background:#fee2e2;color:#b91c1c}
.b-warn{background:#fef3c7;color:#b45309}.b-info{background:#e0f2fe;color:#0369a1}
.b-mut{background:#e5e9f2;color:#5b6478}.b-pri{background:#d1fae5;color:#065f46}
.b-gold{background:#fef3c7;color:#92400e}
.modal-bg{position:fixed;inset:0;background:rgba(57,67,92,.32);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:99}
.modal{width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:22px;border-radius:22px;animation:pop .18s ease;background:var(--bg)}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{margin:0;font-size:1rem}
.modal-foot{display:flex;gap:10px;justify-content:flex-start;margin-top:20px;flex-wrap:wrap}
.icon-btn{border:0;cursor:pointer;width:34px;height:34px;border-radius:11px;background:var(--bg);color:var(--muted);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);font-family:inherit}
#toasts{position:fixed;bottom:22px;left:22px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:340px}
.toast{padding:12px 18px;border-radius:14px;font-size:.82rem;background:var(--bg);box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{border-right:4px solid var(--ok)}.toast.bad{border-right:4px solid var(--bad)}
.toast.warn{border-right:4px solid var(--warn)}.toast.info{border-right:4px solid var(--info)}
.empty{text-align:center;color:var(--muted);padding:34px;font-size:.85rem}
.hint{font-size:.75rem;color:var(--muted);line-height:1.9}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;font-size:.76rem;background:var(--bg);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);cursor:pointer}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:none}
.tabs-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab-chip{padding:8px 14px;border:0;cursor:pointer;font-family:inherit;font-size:.8rem;border-radius:11px;background:var(--bg);color:var(--muted);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl)}
.tab-chip.active{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:none}
.msg-item{padding:14px 16px;border-radius:16px;margin-bottom:10px;background:var(--bg2);border-right:4px solid var(--line)}
.msg-item.urgent{border-right-color:var(--bad)}.msg-item.high{border-right-color:var(--warn)}
.msg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.msg-body{font-size:.84rem;line-height:1.9;white-space:pre-wrap}
.msg-meta{font-size:.72rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.checklist{max-height:280px;overflow:auto;padding:8px;background:var(--bg2);border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:640px){.checklist{grid-template-columns:1fr}}
.checklist label{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;font-size:.8rem;cursor:pointer}
.checklist label:hover{background:var(--bg)}
.checklist input{accent-color:var(--pri)}
.lock-notice{padding:10px 14px;background:#fef3c7;border-radius:12px;font-size:.76rem;color:#92400e;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.lock-notice::before{content:'🔒';font-size:1.1rem}
.welcome{padding:34px 28px;text-align:center;border-radius:22px;background:linear-gradient(135deg,#ecfdf5,#f0fdf4);border:2px dashed #6ee7b7;margin-bottom:20px}
.welcome h2{margin:0 0 8px;font-size:1.2rem}
.welcome .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:20px}
.welcome .step{background:#fff;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.welcome .step .n{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-weight:700}
.welcome .step .t{font-size:.82rem;font-weight:600}
.welcome .step .d{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.6}
#printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:8mm}
  html,body{background:#fff!important;margin:0;padding:0}
  #app,#loginScreen,.modal-bg,#toasts{display:none!important}
  #printSheet{display:block!important;width:194mm;direction:rtl;color:#000;font-family:Vazirmatn,Tahoma,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ps-title{font-size:14pt;font-weight:700;text-align:center;margin-bottom:1mm}
  .ps-sub{font-size:9pt;text-align:center;color:#555;margin-bottom:3mm}
  .ps-info{font-size:9pt;margin-bottom:2mm;display:flex;gap:5mm;flex-wrap:wrap;padding-bottom:1.5mm;border-bottom:.3mm solid #000}
  .ps-info b{font-weight:700}
  .ps-table{width:100%;border-collapse:collapse;font-size:9pt}
  .ps-table th,.ps-table td{border:.2mm solid #333;padding:1.2mm 1.5mm;text-align:center}
  .ps-table th{background:#e8e8e8;font-weight:700}
  .ps-table tfoot td{background:#f3f3f3;font-weight:700}
  .ps-foot{margin-top:3mm;border-top:.3mm solid #000;padding-top:1.5mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:8pt}
  .ps-sign{min-width:55mm;border-bottom:.2mm dotted #333;height:5mm;display:inline-block}
  .ps-legend{font-size:7pt;color:#444;margin-top:1mm}
}
</style>
</head>

<script>
/* ==========================================================
   ابزار پایه
   ========================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isoToday = () => new Date().toISOString().slice(0,10);
const faDate = d => { if(!d) return '—'; try{ return new Date(d).toLocaleDateString('fa-IR'); }catch(e){ return d; } };
const money = n => (Number(n)||0).toLocaleString('fa-IR');
const num = n => (Number(n)||0).toLocaleString('fa-IR');
const toFa = n => String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const faMonth = iso => { // '2025-04' → 'فروردین ۱۴۰۴'
  if(!iso) return '—';
  const [y,m] = iso.split('-').map(Number);
  try{ return new Date(y, m-1, 1).toLocaleDateString('fa-IR',{year:'numeric',month:'long'}); }catch(e){ return iso; }
};
const isActive = (m) => m.active !== false;

const LS='zahra_system_v1';
const SESSION='zahra_session_v1';
let DB={}, CU=null;

const ROLES = {
  superadmin:{label:'سوپر ادمین', color:'#7c3aed'},
  commander:{label:'فرمانده پایگاه', color:'#10b981'},
  cultural:{label:'مسئول فرهنگی', color:'#0ea5e9'},
  member:{label:'عضو', color:'#f59e0b'}
};

/* ==========================================================
   دیتابیس
   ========================================================== */
function emptyDB(){
  return {
    settings:{
      systemName:'سامانه جامع الزهرا',
      baseName:'پایگاه مقاومت بسیج الزهرا (س)',
      mosqueName:'مسجد الزهرا (س)',
      year:'1404-1405',
      address:'',
      phone:'',
      commanderName:''
    },
    users:[
      {id:'u_super', username:'admin', password:'admin', role:'superadmin', name:'سوپر ادمین', active:true}
    ],
    members:[],
    mosqueActivities:[],
    baseActivities:[],
    meetings:[],
    honors:[],
    announcements:[],
    events:[],
    funding:[]
  };
}

function save(){ try{ localStorage.setItem(LS, JSON.stringify(DB)); }catch(e){ toast('خطا در ذخیره‌سازی','bad'); } }

function load(){
  const raw = localStorage.getItem(LS);
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ DB=null; } }
  if(!DB || !DB.users){ DB = emptyDB(); }
  migrate();
  if(DB.members.length===0){ seedData(); save(); }
}

function migrate(){
  const def = emptyDB();
  Object.keys(def).forEach(k=>{ if(!(k in DB)) DB[k]=def[k]; });
  if(!DB.users.find(u=>u.role==='superadmin')){
    DB.users.push({id:'u_super', username:'admin', password:'admin', role:'superadmin', name:'سوپر ادمین', active:true});
  }
}

  // --- اعضای عادی ---
  const REGULAR = [
    {name:'علی احمدی', mobile:'09122220001', birth:'1375-01-12'},
    {name:'محمد رضایی', mobile:'09122220002', birth:'1376-05-20'},

/* ==========================================================
   Toast & Modal
   ========================================================== */
function toast(msg, type='ok'){
  const d = document.createElement('div');
  d.className='toast '+type; d.textContent=msg;
  $('#toasts').appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='.3s'; setTimeout(()=>d.remove(),320); }, 3000);
}

function modal(title, html, onOk, okText='ذخیره', wide){
  const m = document.createElement('div');
  m.className='modal-bg';
  m.innerHTML = `<div class="modal ${wide?'wide':''} neu">
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">${html}</div>
    <div class="modal-foot">
      ${onOk?`<button class="btn primary" data-ok>${okText}</button>`:''}
      <button class="btn" data-close>بستن</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e=>{
    if(e.target===m || e.target.closest('[data-close]')) m.remove();
    if(e.target.closest('[data-ok]')){
      if(onOk && onOk(m)===false) return;
      m.remove();
    }
  });
  const f=m.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),60);
  return m;
}

function doLogin(e){
  e.preventDefault();
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value;
  const user = DB.users.find(x=>x.username===u && x.password===p);
  if(!user){ $('#loginErr').textContent='نام کاربری یا رمز اشتباه است.'; return; }
  if(!user.active){ $('#loginErr').textContent='حساب غیرفعال است.'; return; }
  CU = user;
  localStorage.setItem(SESSION, user.id);
  showApp();
}

  if(!confirm('از حساب خارج می‌شوید؟')) return;

}

function monthOptions(count=6){
  const out=[]; const now=new Date();
  for(let i=0;i<count;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const iso = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('fa-IR',{year:'numeric',month:'long'});
    out.push(`<option value="${iso}">${label}</option>`);
  }
  return out.join('');
}

        <div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px">
          <span>${esc(m.name)}</span><span>${num(hrs)} ساعت</span>
        </div>

    }).join('')}
  </div>`;
}

function memberHoursInMonth(memberId, month){
  let h = 0;
  DB.mosqueActivities.forEach(a=>{ if(a.date.startsWith(month) && a.participants.includes(memberId)) h += Number(a.hours)||0; });
  DB.baseActivities.forEach(a=>{ if(a.date.startsWith(month) && a.participants.includes(memberId)) h += Number(a.hours)||0; });
  DB.meetings.forEach(m=>{ if(m.date.startsWith(month) && m.attendees.includes(memberId)) h += 2; });
  return h;
}
function sumHoursForMonth(month){
  return DB.members.reduce((s,m)=>s+memberHoursInMonth(m.id, month), 0);
}

  </div>`;

  modal(`➕ فعالیت ${isMosque?'مسجد':'پایگاه'}`, html, m=>{

function buildMonthlyReport(month, typeFilter){
  const members = DB.members.filter(m=>isActive(m) && (typeFilter==='all' || m.memberType===typeFilter));
  const rows = members.map(m=>{
    const mActs = DB.mosqueActivities.filter(a=>a.date.startsWith(month) && a.participants.includes(m.id));
    const bActs = DB.baseActivities.filter(a=>a.date.startsWith(month) && a.participants.includes(m.id));
    const meets = DB.meetings.filter(x=>x.date.startsWith(month) && x.attendees.includes(m.id));
    const mH = mActs.reduce((s,a)=>s+(Number(a.hours)||0),0);
    const bH = bActs.reduce((s,a)=>s+(Number(a.hours)||0),0);
    const meetH = meets.length * 2;
    return {
      member:m, mH, bH, meets:meets.length, meetH,
      total:mH+bH+meetH,
      mCount:mActs.length, bCount:bActs.length
    };
  }).sort((a,b)=>b.total-a.total || a.member.name.localeCompare(b.member.name,'fa'));
  return rows;
}

  rows.forEach((r,i)=>{
    data.push([i+1, r.member.name, r.member.memberType==='active'?'فعال':'عادی', r.mH, r.bH, r.meets, r.meetH, r.total]);
  });
  const totalM = rows.reduce((s,r)=>s+r.mH,0);
  const totalB = rows.reduce((s,r)=>s+r.bH,0);
  const totalMeet = rows.reduce((s,r)=>s+r.meets,0);
  const grand = rows.reduce((s,r)=>s+r.total,0);
  data.push(['','جمع کل','',totalM,totalB,totalMeet,totalMeet*2,grand]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), 'گزارش ماهانه');
  XLSX.writeFile(wb, `report-${month}.xlsx`);
  toast('اکسل دانلود شد');
}

function addUser(){
  if(!requireRole('superadmin')) return;
  const html = `<div class="grid2">
    <label class="fld"><span>نام نمایشی *</span><input name="name"></label>
    <label class="fld"><span>نام کاربری *</span><input name="username" dir="ltr"></label>
    <label class="fld"><span>رمز عبور *</span><input name="password"></label>
    <label class="fld"><span>نقش</span><select name="role">
      ${Object.entries(ROLES).filter(([k])=>k!=='superadmin').map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
    </select></label>
    <label class="fld full" id="memWrap" style="display:none"><span>عضو مرتبط (برای نقش «عضو»)</span>
      <select name="memberId"><option value="">—</option>${DB.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${m.memberType==='active'?'فعال':'عادی'})</option>`).join('')}</select>
    </label>
  </div>`;
  const m = modal('➕ کاربر جدید', html, mm=>{
    const name = $('[name=name]',mm).value.trim();
    const un = $('[name=username]',mm).value.trim();
    const pw = $('[name=password]',mm).value;
    if(!name||!un||!pw){ toast('همه فیلدها الزامی','bad'); return false; }
    if(DB.users.some(x=>x.username===un)){ toast('نام کاربری تکراری','bad'); return false; }
    const role = $('[name=role]',mm).value;
    const u = {id:uid(), name, username:un, password:pw, role, active:true};
    if(role==='member') u.memberId = $('[name=memberId]',mm).value;
    DB.users.push(u);
    save(); render(); toast('کاربر اضافه شد');
  });
  const sel = m.querySelector('[name=role]');
  sel.addEventListener('change', ()=>{
    m.querySelector('#memWrap').style.display = sel.value==='member' ? '' : 'none';
  });
}
function editUser(id){
  if(!requireRole('superadmin')) return;
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  const html = `<div class="grid2">
    <label class="fld"><span>نام</span><input name="name" value="${esc(u.name)}"></label>
    <label class="fld"><span>نام کاربری</span><input name="username" value="${esc(u.username)}" dir="ltr"></label>
    <label class="fld"><span>رمز</span><input name="password" value="${esc(u.password)}"></label>
    <label class="fld"><span>نقش</span><select name="role" ${u.role==='superadmin'?'disabled':''}>
      ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v.label}</option>`).join('')}
    </select></label>
  </div>`;
  modal('✏️ ویرایش کاربر', html, m=>{
    const un = $('[name=username]',m).value.trim();
    if(DB.users.some(x=>x.id!==id && x.username===un)){ toast('کاربری تکراری','bad'); return false; }
    u.name = $('[name=name]',m).value.trim();
    u.username = un;
    u.password = $('[name=password]',m).value;
    if(u.role!=='superadmin') u.role = $('[name=role]',m).value;
    save(); render(); toast('ویرایش شد');
  });
}
function toggleUser(id){
  if(!requireRole('superadmin')) return;
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  if(u.id===CU.id){ toast('حساب خودتان را نمی‌توانید غیرفعال کنید','bad'); return; }
  u.active = !u.active;
  save(); render(); toast(u.active?'فعال شد':'غیرفعال شد','warn');
}
function delUser(id){
  if(!requireRole('superadmin')) return;
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  if(u.id===CU.id){ toast('حساب خودتان را نمی‌توانید حذف کنید','bad'); return; }
  if(!confirm(`کاربر «${u.name}» حذف شود؟`)) return;
  DB.users = DB.users.filter(x=>x.id!==id);
  save(); render(); toast('حذف شد','warn');
}

  <div class="card neu">
    <h3>🤝 جلسات این ماه (${num(meets.length)})</h3>
    <div class="hint">${meets.map(x=>`• <b>${esc(x.title)}</b> — ${faDate(x.date)}`).join('<br>') || 'موردی ثبت نشده'}</div>
  </div>`;
}

function vMemberAnnounce(){
  const list = DB.announcements.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const items = list.map(a=>`
    <div class="msg-item ${a.priority==='urgent'?'urgent':a.priority==='high'?'high':''}">
      <div class="msg-head"><b>${esc(a.title)}</b>${priorityBadge(a.priority)}</div>
      <div class="msg-body">${esc(a.body)}</div>
      <div class="msg-meta" style="margin-top:8px">${faDate(a.date)}</div>
    </div>`).join('');
  return `<div class="card neu"><h3>📢 اطلاعیه‌ها</h3>${items || '<div class="empty">اطلاعیه‌ای وجود ندارد</div>'}</div>`;
}

/* ==========================================================
   Export / Import JSON
   ========================================================== */
function exportJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zahra-backup-${isoToday()}.json`;
  a.click();
  toast('پشتیبان دانلود شد');
}

document.addEventListener('change', e=>{
  if(e.target && e.target.id === 'jsonIn'){
    if(!requireRole('superadmin')) { e.target.value=''; return; }
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ev=>{
      try{
        const obj = JSON.parse(ev.target.result);
        if(!obj.users) throw 0;
        DB = obj; migrate(); save(); render(); toast('بازیابی انجام شد');
      }catch(err){ toast('فایل معتبر نیست','bad'); }
    };
    rd.readAsText(f);
    e.target.value = '';
  }
});

/* ==========================================================
   Init
   ========================================================== */
load();

const savedSession = localStorage.getItem(SESSION);
if(savedSession){
  const u = DB.users.find(x=>x.id===savedSession && x.active);
  if(u){ CU=u; showApp(); }
} else {
  $('#loginScreen').style.display='';
  $('#app').style.display='none';
}

$('#q').addEventListener('input', e=>{
  state.q = e.target.value;
  state.page = 1;
  if(CU) render();
});
</script>
